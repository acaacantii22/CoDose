<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102F60">
<title>CoDose — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="splash.css">
</head>
<body>
<!-- ===== CoDose splash (salin blok ini ke web app utama) ===== -->
<div id="codose-splash" class="cd-splash" data-hold="1600" data-autohide="false" data-dev="true" role="img" aria-label="CoDose calculator">
  <div class="cd-stage">
    <svg id="cd-logo" class="cd-logo" viewBox="-330 -110 660 220" aria-hidden="true">
      <defs><path id="cd-c-path" d="M33.4 -39.8A52 52 0 1 0 33.4 39.8"/></defs>
      <g id="cd-world">
        <g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
          <use id="cd-C" href="#cd-c-path" opacity="0"/>
          <circle id="cd-o1" r="34" opacity="0"/>
          <circle id="cd-o2" r="34" opacity="0"/>
          <path id="cd-s" d="M13 -27.9A17 17 0 1 0 0 0A17 17 0 1 1 -13 27.9" opacity="0"/>
          <path id="cd-e" d="M-34 0H34A34 34 0 1 0 26.05 21.9" opacity="0"/>
        </g>
        <g id="cd-ball" opacity="0">
          <path id="cd-shape" fill-rule="evenodd"/>
        </g>
      </g>
    </svg>
    <div class="cd-sub">calculator</div>
  </div>
</div>
<!-- ===== end splash ===== -->
<script src="splash.js"></script>
</body>
</html>
